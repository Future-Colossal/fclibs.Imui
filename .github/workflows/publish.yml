name: Publish to Verdaccio

on:
  push:
    branches:
      - master
      - main
      - dev
    paths:
      - "package.json"
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Check version change
        id: version
        shell: bash
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "0.0.0")
          NEW_VERSION=$(jq -r '.version' package.json)
          echo "old=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Package version changed: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Package version unchanged: $NEW_VERSION"
          fi

      - name: Sign and release UPM package
        if: steps.version.outputs.changed == 'true'
        id: unity-publish
        uses: Future-Colossal/fc-upm-verdaccio-release-v2@v2.0.1-fc
        with:
          organization-id: ${{ secrets.UNITY_ORG_ID }}
          upm-service-account-key-id: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          upm-service-account-key-secret: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-json: '**/package.json'
          split-upm-branch: 'none'

      - name: Show signed package
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "Signed package:"
          echo "${{ steps.unity-publish.outputs.artifact-path }}"

          ls -lh "${{ steps.unity-publish.outputs.artifact-path }}"

      - name: Use Node 24
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.futurecolossal.com

      - name: Publish packed tarball to Verdaccio
        if: steps.version.outputs.changed == 'true'
        run: |
          npm config set registry https://registry.futurecolossal.com
          npm config set //registry.futurecolossal.com/:_authToken=${{ secrets.VERDACCIO_TOKEN }}
          npm publish ${{ steps.unity-publish.outputs.artifact-path }}
